name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions: {}

jobs:
  verify:
    name: Verify and build
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run type checks
        run: bun run typecheck

      - name: Build the macOS app
        run: make app

      - name: Archive the app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ditto -c -k --sequesterRsrc --keepParent tray/dist/LocalJev.app LocalJev.app.zip
          shasum -a 256 LocalJev.app.zip > LocalJev.app.zip.sha256

      - name: Upload release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localjev-app-release
          path: |
            LocalJev.app.zip
            LocalJev.app.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: localjev-app-release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" LocalJev.app.zip LocalJev.app.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
